name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/baoxuanzhushou
            git pull --ff-only
            # .env is gitignored, so it drifts silently: a key added to
            # .env.example later never reaches the server, and the app falls
            # back to code defaults. Compare every key that has a non-empty
            # value in .env.example, and fail loudly on any mismatch.
            missing=0
            while IFS= read -r line; do
              key=${line%%=*}
              want=${line#*=}
              have=$(grep -E "^${key}=" .env | head -1 | cut -d= -f2-)
              if [ -z "$have" ]; then
                echo "::error::.env is missing ${key} (expected ${want}); the app would use a code default"
                missing=1
              elif [ "$have" != "$want" ]; then
                echo "::error::.env ${key}=${have} does not match .env.example ${key}=${want}"
                missing=1
              fi
            done < <(grep -E '^[A-Z_]+=.+' .env.example)
            if [ "$missing" != "0" ]; then
              echo "::error::.env is out of sync with .env.example; refusing to deploy"
              exit 1
            fi
            docker compose up -d --build
            sleep 15
            # The audit service is only exposed on the compose network, so probe it
            # from inside the container instead of from the host.
            docker compose exec -T audit python -c \
              "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=10).read().decode())"
            docker compose ps
