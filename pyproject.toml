[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-audit"
version = "0.1.0"
description = "Evidence-grounded insurance marketing audit demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "pydantic-settings",
  "openai", "httpx", "python-multipart", "pillow", "rank-bm25", "jieba",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pip-tools", "pypdf", "pymupdf"]

[project.scripts]
insurance-audit = "insurance_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
