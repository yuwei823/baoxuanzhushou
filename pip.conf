# Speed up dependency resolution from mainland China builds.
# The Aliyun mirror serves byte-identical PyPI files (hash-safe), but may lag
# behind on the newest releases, so PyPI is kept as a fallback index.
[global]
index-url = https://mirrors.aliyun.com/pypi/simple/
extra-index-url = https://pypi.org/simple/
timeout = 60
retries = 5
